name: Process Content Submission

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # When issue is opened, validate but don't publish yet
  validate-submission:
    if: |
      github.event_name == 'issues' && 
      contains(github.event.issue.labels.*.name, 'content-submission') &&
      !contains(github.event.issue.labels.*.name, 'validated')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - name: Validate submission
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            
            const jsonMatch = body.match(/### Package JSON\s*\n\n```json\n([\s\S]*?)\n```/);
            
            if (!jsonMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ **Validation failed**: Could not find Package JSON in the submission.\n\nPlease make sure to paste the JSON from your clipboard into the "Package JSON" field.'
              });
              return;
            }
            
            let pkg;
            try {
              pkg = JSON.parse(jsonMatch[1]);
            } catch (e) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ **Validation failed**: Invalid JSON format.\n\nError: ${e.message}\n\nPlease check your JSON and try again.`
              });
              return;
            }
            
            if (!pkg.meta || !pkg.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ **Validation failed**: Package must have "meta" and "data" fields.\n\nPlease export your content again from the app.'
              });
              return;
            }
            
            // Success! Add validated label and notify
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['validated', 'awaiting-review']
            });
            
            const cardCount = pkg.meta.cardCount || 0;
            const name = pkg.meta.name || 'Unknown';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Submission validated!**\n\n**${name}** - ${cardCount} cards\n\nYour content is waiting for a maintainer to review and approve it.\n\n---\n_Maintainers: Comment \`/approve\` to publish this content._`
            });

  # When maintainer comments /approve, publish the content
  publish-content:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.labels.*.name, 'validated') &&
      contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Check if commenter is maintainer
        uses: actions/github-script@v7
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login
            });
            
            if (!['admin', 'write'].includes(permission.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ Only maintainers can approve submissions.'
              });
              core.setFailed('Not a maintainer');
            }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and publish
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            
            // Parse the issue form fields
            const nameMatch = body.match(/### Content Name\s*\n\n(.+)/);
            const typeMatch = body.match(/### Content Type\s*\n\n(.+)/);
            const categoryMatch = body.match(/### Category\s*\n\n(.+)/);
            const authorMatch = body.match(/### Your Name\/Username\s*\n\n(.+)/);
            const descMatch = body.match(/### Description\s*\n\n([\s\S]*?)(?=\n### )/);
            const tagsMatch = body.match(/### Tags\s*\n\n(.+)/);
            const jsonMatch = body.match(/### Package JSON\s*\n\n```json\n([\s\S]*?)\n```/);
            
            const pkg = JSON.parse(jsonMatch[1]);
            
            const name = nameMatch?.[1]?.trim() || pkg.meta.name;
            const type = typeMatch?.[1]?.trim() || pkg.meta.type;
            const category = categoryMatch?.[1]?.trim() || pkg.meta.category;
            const author = authorMatch?.[1]?.trim() || pkg.meta.author;
            const description = descMatch?.[1]?.trim() || pkg.meta.description;
            const tags = tagsMatch?.[1]?.trim().split(',').map(t => t.trim()) || pkg.meta.tags;
            
            const id = `${author}-${name}`.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            
            pkg.meta = { ...pkg.meta, id, name, type, category, author, description, tags };
            
            core.setOutput('id', id);
            core.setOutput('name', name);
            core.setOutput('type', type);
            core.setOutput('category', category);
            core.setOutput('author', author);
            core.setOutput('description', description);
            core.setOutput('tags', JSON.stringify(tags));
            core.setOutput('cardCount', pkg.meta.cardCount || 0);
            core.setOutput('package', JSON.stringify(pkg));

      - name: Create content file and update catalog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const id = '${{ steps.extract.outputs.id }}';
            const name = '${{ steps.extract.outputs.name }}';
            const type = '${{ steps.extract.outputs.type }}';
            const category = '${{ steps.extract.outputs.category }}';
            const author = '${{ steps.extract.outputs.author }}';
            const description = `${{ steps.extract.outputs.description }}`;
            const tags = ${{ steps.extract.outputs.tags }};
            const cardCount = parseInt('${{ steps.extract.outputs.cardCount }}') || 0;
            const pkg = ${{ steps.extract.outputs.package }};
            
            // Save package file
            fs.writeFileSync(`content/${id}.json`, JSON.stringify(pkg, null, 2));
            
            // Update catalog
            const catalog = JSON.parse(fs.readFileSync('content-catalog.json', 'utf8'));
            const date = new Date().toISOString().split('T')[0];
            
            const entry = {
              id,
              type,
              name,
              description,
              author,
              authorUrl: `https://github.com/${author}`,
              category,
              tags,
              cardCount,
              version: '1.0.0',
              downloads: 0,
              rating: 0,
              packageUrl: `https://raw.githubusercontent.com/Samurai412/atlasface-community/main/content/${id}.json`,
              previewUrl: null,
              createdAt: date,
              updatedAt: date
            };
            
            catalog.items.push(entry);
            catalog.lastUpdated = date;
            
            fs.writeFileSync('content-catalog.json', JSON.stringify(catalog, null, 2));

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add: ${{ steps.extract.outputs.name }} by ${{ steps.extract.outputs.author }}
          
          Closes #${{ github.event.issue.number }}"
          git push

      - name: Close issue with success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🎉 **Published!**\n\n"${process.env.NAME}" is now live!\n\nInstall: \`af market install ${process.env.ID}\`\n\nThank you for contributing!`
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['content-submission', 'published']
            });
        env:
          NAME: ${{ steps.extract.outputs.name }}
          ID: ${{ steps.extract.outputs.id }}
