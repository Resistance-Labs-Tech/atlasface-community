name: Process Content Submission

on:
  issues:
    types: [opened, edited, labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  process-submission:
    if: contains(github.event.issue.labels.*.name, 'content-submission')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate submission
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            
            // Parse the issue form fields
            const nameMatch = body.match(/### Content Name\s*\n\n(.+)/);
            const typeMatch = body.match(/### Content Type\s*\n\n(.+)/);
            const categoryMatch = body.match(/### Category\s*\n\n(.+)/);
            const authorMatch = body.match(/### Your Name\/Username\s*\n\n(.+)/);
            const descMatch = body.match(/### Description\s*\n\n([\s\S]*?)(?=\n### )/);
            const tagsMatch = body.match(/### Tags\s*\n\n(.+)/);
            const jsonMatch = body.match(/### Package JSON\s*\n\n```json\n([\s\S]*?)\n```/);
            
            if (!jsonMatch) {
              core.setFailed('Could not find Package JSON in the issue');
              return;
            }
            
            let pkg;
            try {
              pkg = JSON.parse(jsonMatch[1]);
            } catch (e) {
              core.setFailed('Invalid JSON in Package JSON field: ' + e.message);
              return;
            }
            
            if (!pkg.meta || !pkg.data) {
              core.setFailed('Package must have "meta" and "data" fields');
              return;
            }
            
            // Use form values or fall back to package meta
            const name = nameMatch?.[1]?.trim() || pkg.meta.name;
            const type = typeMatch?.[1]?.trim() || pkg.meta.type;
            const category = categoryMatch?.[1]?.trim() || pkg.meta.category;
            const author = authorMatch?.[1]?.trim() || pkg.meta.author;
            const description = descMatch?.[1]?.trim() || pkg.meta.description;
            const tags = tagsMatch?.[1]?.trim().split(',').map(t => t.trim()) || pkg.meta.tags;
            
            // Generate ID
            const id = `${author}-${name}`.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            
            // Update package meta with form values
            pkg.meta = {
              ...pkg.meta,
              id,
              name,
              type,
              category,
              author,
              description,
              tags,
            };
            
            // Output for next steps
            core.setOutput('id', id);
            core.setOutput('name', name);
            core.setOutput('type', type);
            core.setOutput('category', category);
            core.setOutput('author', author);
            core.setOutput('description', description);
            core.setOutput('tags', JSON.stringify(tags));
            core.setOutput('cardCount', pkg.meta.cardCount || 0);
            core.setOutput('package', JSON.stringify(pkg));
            
            console.log(`✓ Validated submission: ${name} by ${author}`);

      - name: Create content file and update catalog
        run: |
          ID="${{ steps.extract.outputs.id }}"
          NAME="${{ steps.extract.outputs.name }}"
          TYPE="${{ steps.extract.outputs.type }}"
          CATEGORY="${{ steps.extract.outputs.category }}"
          AUTHOR="${{ steps.extract.outputs.author }}"
          DESCRIPTION="${{ steps.extract.outputs.description }}"
          TAGS='${{ steps.extract.outputs.tags }}'
          CARD_COUNT="${{ steps.extract.outputs.cardCount }}"
          
          # Save the package JSON
          echo '${{ steps.extract.outputs.package }}' | jq '.' > "content/${ID}.json"
          echo "✓ Created content/${ID}.json"
          
          # Update catalog
          DATE=$(date +%Y-%m-%d)
          
          # Create catalog entry
          ENTRY=$(jq -n \
            --arg id "$ID" \
            --arg type "$TYPE" \
            --arg name "$NAME" \
            --arg description "$DESCRIPTION" \
            --arg author "$AUTHOR" \
            --arg category "$CATEGORY" \
            --argjson tags "$TAGS" \
            --argjson cardCount "$CARD_COUNT" \
            --arg date "$DATE" \
            '{
              id: $id,
              type: $type,
              name: $name,
              description: $description,
              author: $author,
              authorUrl: ("https://github.com/" + $author),
              category: $category,
              tags: $tags,
              cardCount: $cardCount,
              version: "1.0.0",
              downloads: 0,
              rating: 0,
              packageUrl: ("https://raw.githubusercontent.com/Samurai412/atlasface-community/main/content/" + $id + ".json"),
              previewUrl: null,
              createdAt: $date,
              updatedAt: $date
            }')
          
          # Add to catalog
          jq --argjson entry "$ENTRY" --arg date "$DATE" \
            '.items += [$entry] | .lastUpdated = $date' \
            content-catalog.json > content-catalog.json.tmp
          mv content-catalog.json.tmp content-catalog.json
          
          echo "✓ Updated content-catalog.json"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add: ${{ steps.extract.outputs.name }} by ${{ steps.extract.outputs.author }}
          
          Closes #${{ github.event.issue.number }}"
          git push

      - name: Close issue with success comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🎉 **Content published!**\n\nYour content "${process.env.NAME}" is now live in the Community Marketplace!\n\nUsers can find it by:\n- Browsing the marketplace in ATLAS Face\n- Running \`af market search "${process.env.NAME}"\`\n- Installing with \`af market install ${process.env.ID}\`\n\nThank you for contributing! ❤️`
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['content-submission', 'published']
            });
        env:
          NAME: ${{ steps.extract.outputs.name }}
          ID: ${{ steps.extract.outputs.id }}
